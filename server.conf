# ==============================================================================
# IDGUARD DNS - High-Performance Recursive Resolver Configuration
# Optimized for ISP-Scale & Threat Intelligence Filtering
# Maintainer: Sysadmin @ Dev'Hunter Security
# ==============================================================================

include-toplevel: "/etc/unbound/unbound.conf.d/*.conf"
# Struktur folder untuk filtering malware & trackers
include: "/etc/unbound/unbound.conf.d/00-safesearch/*.conf"
include: "/etc/unbound/unbound.conf.d/malware/*.conf"
include: "/etc/unbound/unbound.conf.d/zzz-whitelist/*.conf"

server:
    # --- Logging & Verbosity ---
    verbosity: 1
    logfile: /var/log/unbound.log
    log-queries: no
    log-local-actions: no
    log-replies: no
    log-servfail: no

    # --- Interface Settings (Replace with your server IPs) ---
    interface: 0.0.0.0          # Listen to all IPv4
    interface: ::0              # Listen to all IPv6
    port: 53

    # --- Protocol Stack ---
    do-ip4: yes
    do-ip6: yes
    do-udp: yes
    do-tcp: yes
    prefer-ip4: yes

    # --- Extended DNS Errors (EDE) ---
    ede: yes
    ede-serve-expired: yes
    val-log-level: 2

    # --- Access Control (Bogon & Private Ranges Filter) ---
    # IPv4 Anti-Bogon
    access-control: 0.0.0.0/8 refuse
    access-control: 10.0.0.0/8 refuse
    access-control: 100.64.0.0/10 refuse
    access-control: 127.0.0.0/8 refuse
    access-control: 169.254.0.0/16 refuse
    access-control: 172.16.0.0/12 refuse
    access-control: 192.0.0.0/24 refuse
    access-control: 192.168.0.0/16 refuse
    access-control: 224.0.0.0/4 refuse
    access-control: 240.0.0.0/4 refuse
    access-control: 0.0.0.0/0 refuse # Default deny, override with local include

    # IPv6 Anti-Bogon
    access-control: ::1/128 refuse
    access-control: ::/128 refuse
    access-control: fc00::/7 refuse
    access-control: fe80::/10 refuse
    access-control: ff00::/8 refuse
    access-control: ::0/0 refuse # Default deny

    # Include authorized client ranges (ISP Prefixes)
    include: "/etc/unbound/allowed_clients_v4.conf"
    include: "/etc/unbound/allowed_clients_v6.conf"

    # --- Server Identity & Privacy ---
    hide-identity: yes
    hide-version: yes
    identity: "IdGuard-DNS"
    qname-minimisation: yes
    minimal-responses: yes
    deny-any: yes

    # --- Hardening & Security ---
    harden-glue: yes
    harden-short-bufsize: yes
    use-caps-for-id: yes
    harden-below-nxdomain: yes
    val-clean-additional: yes
    aggressive-nsec: yes

    # --- Performance Tuning (ISP Scale) ---
    # Sesuaikan dengan jumlah Core CPU (e.g., 2 Threads)
    num-threads: 2
    msg-cache-slabs: 2
    rrset-cache-slabs: 2
    infra-cache-slabs: 2
    key-cache-slabs: 2
    
    # Memory Allocation (Adjust based on RAM availability)
    rrset-cache-size: 512m
    msg-cache-size: 512m
    key-cache-size: 32m
    neg-cache-size: 16m
    
    # Socket Buffers & Ranges
    outgoing-range: 4096
    num-queries-per-thread: 2048
    so-rcvbuf: 8m
    so-sndbuf: 8m
    so-reuseport: yes

    # --- Cache & TTL Policy ---
    cache-min-ttl: 30
    cache-max-ttl: 604800
    cache-max-negative-ttl: 86400
    prefetch: yes
    prefetch-key: yes
    
    # Zero-Downtime Serving (Serve Expired)
    serve-expired: yes
    serve-expired-ttl: 86400
    serve-expired-client-timeout: 1800

    # --- Rate Limiting (Flood Protection) ---
    ratelimit: 1000
    ratelimit-slabs: 2
    ratelimit-size: 4m

    # --- EDNS Optimization ---
    edns-buffer-size: 1232
    max-udp-size: 1232

    # --- Operational Parameters ---
    do-daemonize: no
    do-not-query-localhost: yes
    module-config: "iterator" # Non-DNSSEC mode as per original req

# ------------------------------------------------------------------------------
# LOCAL ZONE EXAMPLE (Internal Infrastructure)
# ------------------------------------------------------------------------------
    local-zone: "my-dns.internal." static
    local-data: "my-dns.internal. 86400 IN A 1.2.3.4"
    local-data: "ns1.my-dns.internal. 86400 IN A 1.2.3.4"

# ------------------------------------------------------------------------------
# FORWARDING (Upstream Resolvers)
# ------------------------------------------------------------------------------
forward-zone:
    name: "."
    # Quad9 (Malware Filtering)
    forward-addr: 9.9.9.9
    forward-addr: 149.112.112.112
    # Cloudflare (Security)
    forward-addr: 1.1.1.2
    forward-addr: 1.0.0.2
    forward-no-cache: no

remote-control:
    control-enable: yes
