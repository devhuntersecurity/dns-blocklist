# ==============================================================================
# Unbound Configuration File for Debian / IDGuard DNS
# Ultimate Production Version - Fast Root Resolver Mode (2 vCPU / 8 GB RAM)
# ==============================================================================
# Repository: https://github.com/username/repository-name
# Description: High-performance caching recursive DNS resolver optimized for 
#              production environments with 2 vCPUs and 8GB RAM.
# ==============================================================================

include-toplevel: "/etc/unbound/unbound.conf.d/*.conf"
include: "/etc/unbound/unbound.conf.d/malware/*.conf"
include: "/etc/unbound/unbound.conf.d/zzz-whitelist/*.conf"

server:
    verbosity: 1

    # Interface Listener (Change to your public IP addresses)
    interface: 203.0.113.53
    interface: 2001:db8::53
    port: 53

    # Logging
    logfile: "/var/log/unbound.log"
    log-queries: no
    log-local-actions: no
    log-replies: no
    log-servfail: no

    # Root Hints (Uncomment if using root.hints file)
    #root-hints: "/var/lib/unbound/root.hints"

    # Protocol Options
    do-ip6: yes
    do-ip4: yes
    do-udp: yes
    do-tcp: yes
    prefer-ip6: no
    prefer-ip4: yes

    # Extended Errors (EDE)
    ede: yes
    ede-serve-expired: yes
    val-log-level: 0

    # Access Control (Filtering Bogon / Reserved IPv4)
    access-control: 0.0.0.0/8 refuse
    access-control: 10.0.0.0/8 refuse
    access-control: 100.64.0.0/10 refuse
    access-control: 127.0.0.0/8 refuse
    access-control: 169.254.0.0/16 refuse
    access-control: 172.16.0.0/12 refuse
    access-control: 192.0.0.0/24 refuse
    access-control: 192.0.2.0/24 refuse
    access-control: 192.88.99.0/24 refuse
    access-control: 192.168.0.0/16 refuse
    access-control: 198.18.0.0/15 refuse
    access-control: 198.51.100.0/24 refuse
    access-control: 203.0.113.0/24 refuse
    access-control: 224.0.0.0/4 refuse
    access-control: 240.0.0.0/4 refuse
    access-control: 255.255.255.255/32 refuse

    # Local Private Addresses
    private-address: 10.0.0.0/8
    private-address: 127.0.0.0/8
    private-address: 172.16.0.0/12
    private-address: 192.168.0.0/16
    private-address: 169.254.0.0/16
    private-address: fd00::/8
    private-address: fe80::/10

    # Access Control (Filtering Bogon / Reserved IPv6)
    access-control: ::1/128 refuse
    access-control: ::/128 refuse
    access-control: ::ffff:0:0/96 refuse
    access-control: 64:ff9b::/96 refuse
    access-control: 100::/64 refuse
    access-control: 2001:db8::/32 refuse
    access-control: 2001:10::/28 refuse
    access-control: 2001:20::/28 refuse
    access-control: fc00::/7 refuse
    access-control: fe80::/10 refuse
    access-control: ff00::/8 refuse

    # Custom Allowed Clients Inclusion
    include: "/etc/unbound/AllowIP_v4.conf"
    include: "/etc/unbound/AllowIP_v6.conf"

    # Privacy & Identity
    hide-identity: yes
    hide-version: yes
    hide-http-user-agent: no
    http-user-agent: "DNS"
    identity: "DNS"

    # Security Hardening
    harden-glue: yes
    harden-short-bufsize: yes
    use-caps-for-id: no
    harden-referral-path: no
    harden-algo-downgrade: no
    harden-below-nxdomain: yes
    harden-large-queries: yes

    # Cache TTL & Serve Expired Optimization (Dynamic CDN & Gaming Optimized)
    cache-min-ttl: 0
    cache-max-ttl: 86400
    cache-max-negative-ttl: 3600
    serve-expired: yes
    serve-expired-ttl: 86400
    serve-expired-client-timeout: 50
    serve-expired-reply-ttl: 10
    serve-expired-ttl-reset: yes

    # Prefetching Options
    prefetch: yes
    prefetch-key: no

    # Multi-Threading Tuning (2 vCPU)
    num-threads: 2
    outgoing-range: 8192
    num-queries-per-thread: 4096

    # Memory Cache & Slabs (2 Threads & RAM 8 GB)
    msg-cache-slabs: 2
    rrset-cache-slabs: 2
    infra-cache-slabs: 2
    key-cache-slabs: 2
    msg-cache-size: 512m
    rrset-cache-size: 1024m
    key-cache-size: 0m
    neg-cache-size: 64m
    msg-buffer-size: 65536
    so-sndbuf: 8m
    so-rcvbuf: 8m
    rrset-roundrobin: yes

    # Connection Queue & TCP Tuning
    aggressive-nsec: yes
    delay-close: 1000
    tcp-upstream: no
    incoming-num-tcp: 256
    outgoing-num-tcp: 256
    tcp-idle-timeout: 10000
    stream-wait-size: 16m
    so-reuseport: yes

    # Fast Fetch Policy for Root Resolving
    target-fetch-policy: "3 2 1 0 0"

    # Daemon & Query Minimization
    do-daemonize: no
    do-not-query-localhost: yes
    do-not-query-address: 127.0.0.0/8
    do-not-query-address: ::1
    qname-minimisation: yes
    minimal-responses: yes
    deny-any: yes

    # Rate Limiting & Spoof Protection
    ratelimit: 0
    ratelimit-slabs: 2
    ratelimit-size: 4m
    unwanted-reply-threshold: 10000000

    # Non-DNSSEC Forwarding / Root Mode Safe Config
    module-config: "iterator"
    harden-dnssec-stripped: no
    val-permissive-mode: yes
    val-clean-additional: yes

    # Fast Server Selection for High-Throughput Root Iteration
    fast-server-num: 3
    fast-server-permil: 900
    infra-host-ttl: 900
    infra-cache-numhosts: 200000

    # Connection Timeouts
    unknown-server-time-limit: 300
    discard-timeout: 5000
    tcp-auth-query-timeout: 500
    max-sent-count: 48

    # EDNS Buffer
    edns-buffer-size: 1232
    max-udp-size: 1232

    # Statistics
    statistics-cumulative: yes
    extended-statistics: yes
    statistics-interval: 0

auth-zone:
    name: "."
    zonefile: "/var/lib/unbound/root.zone"
    fallback-enabled: yes
    for-downstream: no
    for-upstream: yes
    
    # ICANN official zone transfer distribution nodes (Recommended primary)
    primary: 192.0.47.132         # xfr.cjr.dns.icann.org
    primary: 192.0.32.132         # xfr.lax.dns.icann.org
    primary: 2620:0:2830:202::132 # xfr.cjr.dns.icann.org (IPv6)
    primary: 2620:0:2d0:202::132  # xfr.lax.dns.icann.org (IPv6)

    # Selected Root Servers supporting AXFR
    primary: 192.33.4.12          # c.root-servers.net
    primary: 199.7.91.13          # d.root-servers.net
    primary: 192.5.5.241          # f.root-servers.net
    primary: 192.112.36.4         # g.root-servers.net
    primary: 193.0.14.129         # k.root-servers.net
    primary: 2001:500:2::c        # c.root-servers.net (IPv6)
    primary: 2001:500:2d::d       # d.root-servers.net (IPv6)
    primary: 2001:500:2f::f       # f.root-servers.net (IPv6)
    primary: 2001:500:12::d0d     # g.root-servers.net (IPv6)
    primary: 2001:7fd::1          # k.root-servers.net (IPv6)

remote-control:
    control-enable: yes
    control-interface: 127.0.0.1
    control-port: 8953
    server-key-file: "/etc/unbound/unbound_server.key"
    server-cert-file: "/etc/unbound/unbound_server.pem"
    control-key-file: "/etc/unbound/unbound_control.key"
    control-cert-file: "/etc/unbound/unbound_control.pem"
