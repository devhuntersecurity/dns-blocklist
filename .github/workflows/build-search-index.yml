
name: IDGuard DNS - Build Search Index

on:
  push:
    branches:
      - main
    paths:
      - 'BlockList_DB/**'
      - 'WhiteList DB/**'
      - 'Unbound Config/Data/**'
      - '.github/workflows/build-search-index.yml'

  schedule:
    - cron: '0 */8 * * *'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: idguard-search-index
  cancel-in-progress: false

jobs:
  build-index:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Build, Validate and Publish Search Index
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          import gzip
          import json
          import re
          import sqlite3
          import os
          import shutil
          from datetime import datetime, timezone
          from pathlib import Path
          from itertools import groupby

          ROOTS = {
              "BlockList_DB": "block",
              "WhiteList DB": "allow",
              "Unbound Config/Data": "block"
          }

          DB_FILE = "index-build.sqlite"
          OUTPUT = Path("Search_Index")

          if OUTPUT.exists():
              shutil.rmtree(OUTPUT)

          OUTPUT.mkdir(parents=True)

          pattern = re.compile(
              r'^\s*local-zone:\s*"([^"]+)"\s+'
              r'(always_nxdomain|always_transparent)\s*(?:#.*)?$'
          )

          conn = sqlite3.connect(DB_FILE)

          conn.execute("PRAGMA journal_mode=OFF")
          conn.execute("PRAGMA synchronous=OFF")
          conn.execute("PRAGMA temp_store=FILE")
          conn.execute("PRAGMA cache_size=-200000")

          conn.execute("""
              CREATE TABLE entries (
                  domain TEXT NOT NULL,
                  type TEXT NOT NULL,
                  category TEXT NOT NULL,
                  source_path TEXT NOT NULL,
                  source_file TEXT NOT NULL,
                  shard TEXT NOT NULL,
                  PRIMARY KEY (
                      domain,
                      type,
                      category,
                      source_path
                  )
              ) WITHOUT ROWID
          """)

          insert_sql = """
              INSERT OR IGNORE INTO entries
              VALUES (?, ?, ?, ?, ?, ?)
          """

          source_entries = 0
          inserted_entries = 0
          batch = []

          print("=== BUILDING IDGUARD SEARCH INDEX ===")

          for root, expected_type in ROOTS.items():

              base = Path(root)

              if not base.exists():
                  raise RuntimeError(
                      f"Required source directory missing: {root}"
                  )

              print("SCANNING:", root)

              for file in sorted(base.rglob("*.conf")):

                  relative = file.as_posix()
                  relative_parts = file.relative_to(base).parts

                  if root == "BlockList_DB":
                      category = (
                          relative_parts[0]
                          if len(relative_parts) > 1
                          else file.stem
                      )

                  elif root == "Unbound Config/Data":
                      category = "TrustPositif Komdigi"

                  else:
                      category = file.stem

                  with file.open(
                      "r",
                      encoding="utf-8",
                      errors="ignore"
                  ) as stream:

                      for line in stream:

                          match = pattern.match(line)

                          if not match:
                              continue

                          domain, action = match.groups()
                          domain = domain.lower().rstrip(".")

                          if not domain:
                              continue

                          if domain.endswith(
                              (".in-addr.arpa", ".ip6.arpa")
                          ):
                              continue

                          if action == "always_nxdomain":
                              kind = "block"

                          elif action == "always_transparent":
                              kind = "allow"

                          else:
                              continue

                          if kind != expected_type:
                              continue

                          shard = hashlib.sha256(
                              domain.encode("utf-8")
                          ).hexdigest()[:2]

                          batch.append((
                              domain,
                              kind,
                              category,
                              relative,
                              file.name,
                              shard
                          ))

                          source_entries += 1

                          if len(batch) >= 50000:

                              before = conn.total_changes

                              conn.executemany(
                                  insert_sql,
                                  batch
                              )

                              inserted_entries += (
                                  conn.total_changes - before
                              )

                              conn.commit()
                              batch.clear()

          if batch:

              before = conn.total_changes

              conn.executemany(
                  insert_sql,
                  batch
              )

              inserted_entries += (
                  conn.total_changes - before
              )

              conn.commit()
              batch.clear()

          unique_domains = conn.execute("""
              SELECT COUNT(DISTINCT domain)
              FROM entries
          """).fetchone()[0]

          unique_block = conn.execute("""
              SELECT COUNT(DISTINCT domain)
              FROM entries
              WHERE type = 'block'
          """).fetchone()[0]

          unique_allow = conn.execute("""
              SELECT COUNT(DISTINCT domain)
              FROM entries
              WHERE type = 'allow'
          """).fetchone()[0]

          conflicts = conn.execute("""
              SELECT COUNT(*)
              FROM (
                  SELECT domain
                  FROM entries
                  GROUP BY domain
                  HAVING COUNT(DISTINCT type) > 1
              )
          """).fetchone()[0]

          print("=== EXPORTING 256 SEARCH SHARDS ===")

          shard_list = [
              row[0]
              for row in conn.execute("""
                  SELECT DISTINCT shard
                  FROM entries
                  ORDER BY shard
              """)
          ]

          shard_report = {}
          compressed_total = 0
          largest_shard = 0

          for shard in shard_list:

              target = OUTPUT / f"{shard}.jsonl.gz"

              cursor = conn.execute("""
                  SELECT
                      domain,
                      type,
                      category,
                      source_path,
                      source_file
                  FROM entries
                  WHERE shard = ?
                  ORDER BY
                      domain,
                      type,
                      category,
                      source_path
              """, (shard,))

              domain_count = 0

              with gzip.open(
                  target,
                  "wt",
                  encoding="utf-8",
                  compresslevel=6
              ) as output:

                  for domain, group in groupby(
                      cursor,
                      key=lambda row: row[0]
                  ):

                      matches = []

                      for row in group:
                          matches.append({
                              "source_type": row[1],
                              "category": row[2],
                              "path": row[3],
                              "filename": row[4]
                          })

                      record = {
                          "domain": domain,
                          "matches": matches
                      }

                      output.write(
                          json.dumps(
                              record,
                              separators=(",", ":")
                          ) + "\n"
                      )

                      domain_count += 1

              size = target.stat().st_size

              compressed_total += size
              largest_shard = max(
                  largest_shard,
                  size
              )

              shard_report[shard] = {
                  "domains": domain_count,
                  "compressed_bytes": size
              }

              print(
                  f"Shard {shard}: "
                  f"{domain_count} domains, {size} bytes"
              )

          # ==========================================
          # GENERATE MANIFEST WITH UTC TIMESTAMP
          # ==========================================

          commit = os.environ["GITHUB_SHA"]
          generated_at = datetime.now(timezone.utc).isoformat()

          manifest = {
              "project": "IDGuard DNS",
              "format_version": 1,
              "generated_from_commit": commit,
              "generated_at": generated_at,
              "storage_branch": "search-index",
              "storage_path": "Search_Index",
              "hash_algorithm": "SHA-256",
              "shard_prefix_length": 2,
              "shard_count": len(shard_list),
              "source_entries": source_entries,
              "unique_source_records": inserted_entries,
              "unique_domains": unique_domains,
              "unique_blocklist_domains": unique_block,
              "unique_whitelist_domains": unique_allow,
              "block_whitelist_conflicts": conflicts,
              "compressed_size_bytes": compressed_total,
              "largest_shard_bytes": largest_shard,
              "shards": shard_report
          }

          manifest_path = OUTPUT / "manifest.json"

          manifest_path.write_text(
              json.dumps(manifest, indent=2),
              encoding="utf-8"
          )

          # ==========================================
          # VALIDATION ENGINE
          # ==========================================

          def lookup(domain):

              domain = domain.lower().strip().rstrip(".")

              if not domain:
                  return {
                      "domain": domain,
                      "status": "NOT_FOUND",
                      "matches": []
                  }

              labels = domain.split(".")

              candidates = [
                  ".".join(labels[i:])
                  for i in range(len(labels))
              ]

              found = []

              for candidate in candidates:

                  rows = conn.execute("""
                      SELECT
                          domain,
                          type,
                          category,
                          source_path,
                          source_file
                      FROM entries
                      WHERE domain = ?
                  """, (candidate,)).fetchall()

                  for row in rows:

                      match_type = (
                          "exact"
                          if row[0] == domain
                          else "parent"
                      )

                      found.append({
                          "domain": row[0],
                          "source_type": row[1],
                          "category": row[2],
                          "path": row[3],
                          "filename": row[4],
                          "match_type": match_type
                      })

              unique = {}

              for item in found:

                  key = (
                      item["domain"],
                      item["source_type"],
                      item["category"],
                      item["path"],
                      item["match_type"]
                  )

                  unique[key] = item

              found = list(unique.values())

              types = {
                  item["source_type"]
                  for item in found
              }

              if "block" in types and "allow" in types:
                  status = "CONFLICT"

              elif "block" in types:
                  status = "BLOCKLIST"

              elif "allow" in types:
                  status = "WHITELIST"

              else:
                  status = "NOT_FOUND"

              return {
                  "domain": domain,
                  "status": status,
                  "matches": found
              }

          tests = []

          def run_test(
              name,
              domain,
              expected,
              required_match=None
          ):

              result = lookup(domain)

              passed = result["status"] == expected

              if required_match:

                  passed = passed and any(
                      item["match_type"] == required_match
                      for item in result["matches"]
                  )

              tests.append({
                  "test": name,
                  "domain": domain,
                  "expected": expected,
                  "actual": result["status"],
                  "passed": passed
              })

              print(
                  ("PASS" if passed else "FAIL"),
                  name,
                  domain,
                  result["status"]
              )

          # 1. Exact match

          exact_row = conn.execute("""
              SELECT domain
              FROM entries
              WHERE instr(domain, '.') > 0
                AND category != 'TLDs'
              ORDER BY domain
              LIMIT 1
          """).fetchone()

          if exact_row:

              exact_domain = exact_row[0]
              expected = lookup(exact_domain)["status"]

              run_test(
                  "Exact match",
                  exact_domain,
                  expected,
                  "exact"
              )

          # Unique probe prefix for hierarchy tests.

          probe = (
              "idguard-probe-"
              + commit[:12].lower()
          )

          # 2. Parent-domain match

          parent_row = conn.execute("""
              SELECT domain
              FROM entries
              WHERE instr(domain, '.') > 0
                AND category != 'TLDs'
              ORDER BY domain
              LIMIT 1
          """).fetchone()

          if parent_row:

              parent = parent_row[0]
              expected = lookup(parent)["status"]

              run_test(
                  "Parent domain match",
                  probe + "." + parent,
                  expected,
                  "parent"
              )

              # 3. Subdomain match

              run_test(
                  "Subdomain match",
                  "deep." + probe + "." + parent,
                  expected,
                  "parent"
              )

          # 4. TLD rule

          tld_row = conn.execute("""
              SELECT domain
              FROM entries
              WHERE category = 'TLDs'
                AND instr(domain, '.') = 0
              LIMIT 1
          """).fetchone()

          if tld_row:

              tld = tld_row[0]

              run_test(
                  "TLD rule",
                  "probe.example." + tld,
                  "BLOCKLIST",
                  "parent"
              )

          # 5. Blocklist and whitelist conflict

          conflict_row = conn.execute("""
              SELECT domain
              FROM entries
              GROUP BY domain
              HAVING COUNT(DISTINCT type) > 1
              LIMIT 1
          """).fetchone()

          if conflict_row:

              run_test(
                  "Blocklist and whitelist conflict",
                  conflict_row[0],
                  "CONFLICT"
              )

          # 6. NOT_FOUND

          missing_domain = (
              "idguard-validation-"
              + commit[:12].lower()
              + ".invalid"
          )

          run_test(
              "NOT_FOUND",
              missing_domain,
              "NOT_FOUND"
          )

          validation = {
              "tests": tests,
              "passed": sum(
                  1 for item in tests
                  if item["passed"]
              ),
              "failed": sum(
                  1 for item in tests
                  if not item["passed"]
              )
          }

          Path("index-validation.json").write_text(
              json.dumps(validation, indent=2),
              encoding="utf-8"
          )

          report = {
              "source_entries": source_entries,
              "unique_source_records": inserted_entries,
              "unique_index_entries": unique_domains,
              "unique_blocklist_domains": unique_block,
              "unique_whitelist_domains": unique_allow,
              "block_whitelist_conflicts": conflicts,
              "shards_created": len(shard_list),
              "compressed_size_bytes": compressed_total,
              "largest_shard_bytes": largest_shard,
              "validation_passed": validation["passed"],
              "validation_failed": validation["failed"]
          }

          Path("index-report.json").write_text(
              json.dumps(report, indent=2),
              encoding="utf-8"
          )

          print("=== FINAL INDEX REPORT ===")
          print(json.dumps(report, indent=2))

          print("=== VALIDATION REPORT ===")
          print(json.dumps(validation, indent=2))

          if validation["failed"] > 0:
              raise SystemExit(
                  "Validation failed. Publishing cancelled."
              )

          if validation["passed"] != 6:
              raise SystemExit(
                  "Expected six successful validation tests."
              )

          if unique_domains == 0 or len(shard_list) == 0:
              raise SystemExit(
                  "Empty index. Publishing cancelled."
              )

          conn.close()

          print("BUILD AND VALIDATION COMPLETED.")
          PY

      - name: Prepare Dedicated Publication Branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          mkdir -p publication
          cp -a Search_Index publication/

          cd publication

          git init -b search-index

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add Search_Index

          git commit -m "Publish IDGuard DNS Search Index"

          git remote add origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git push --force origin search-index

          echo "Search index successfully published."

      - name: Publish Build Summary
        if: success()
        shell: bash
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          {
            echo "# IDGuard DNS Search Index"
            echo ""
            echo "Publication status: SUCCESS"
            echo ""
            echo "Branch: search-index"
            echo "Directory: Search_Index/"
            echo ""
            echo "Manifest:"
            echo "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/search-index/Search_Index/manifest.json"
            echo ""
            echo "Validation: 6 tests passed"
          } >> "$GITHUB_STEP_SUMMARY"
