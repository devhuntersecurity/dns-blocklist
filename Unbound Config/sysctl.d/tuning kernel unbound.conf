# =========================================================
# Debian 13 (Trixie) | Kernel 6.12.x
# Hardware : 2 vCPU | 8 GB RAM
# =========================================================

# Filesystem Limits
fs.file-max = 2097152

# Core Network & Socket Buffers
net.core.somaxconn = 32768
net.core.netdev_max_backlog = 65536
net.core.netdev_budget = 600

net.core.rmem_default = 262144
net.core.wmem_default = 262144
net.core.rmem_max = 8388608
net.core.wmem_max = 8388608

# Congestion Control
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# UDP Memory & Minimum Buffers
net.ipv4.udp_mem = 262144 524288 786432
net.ipv4.udp_rmem_min = 16384
net.ipv4.udp_wmem_min = 16384

# TCP Tuning
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_max_syn_backlog = 16384
net.ipv4.tcp_syn_retries = 2
net.ipv4.tcp_synack_retries = 2
net.ipv4.tcp_rmem = 4096 87380 8388608
net.ipv4.tcp_wmem = 4096 65536 8388608
net.ipv4.tcp_fin_timeout = 15
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_max_tw_buckets = 200000

# Ephemeral Port Range
net.ipv4.ip_local_port_range = 10240 65535

# Reverse Path Filtering & Security
net.ipv4.conf.all.rp_filter = 0
net.ipv4.conf.default.rp_filter = 0
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0

# Conntrack
net.netfilter.nf_conntrack_max = 524288
net.netfilter.nf_conntrack_buckets = 131072
net.netfilter.nf_conntrack_udp_timeout = 10
net.netfilter.nf_conntrack_udp_timeout_stream = 30

# Memory Management
vm.swappiness = 10
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5
vm.min_free_kbytes = 131072
vm.panic_on_oom = 0
vm.zone_reclaim_mode = 0

# Prevent IPv6 Neighbor Table Overflow
net.ipv6.neigh.default.gc_thresh1 = 2048
net.ipv6.neigh.default.gc_thresh2 = 4096
net.ipv6.neigh.default.gc_thresh3 = 8192
net.ipv6.neigh.default.gc_stale_time = 60

# IPv6 Route Cache Tuning
net.ipv6.route.max_size = 1048576

# Disable IPv6 Redirects
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0

# Optimize IPv6 TCP Retransmission
net.ipv4.tcp_orphan_retries = 2